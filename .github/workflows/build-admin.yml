name: build-admin

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="${{ github.sha }}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_success="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-admin.yml/runs?branch=${GITHUB_REF_NAME}&event=push&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // ""'
          )"

          base=""
          base_source=""
          if [[ -n "${last_success}" && "${last_success}" != "${head}" ]] && git cat-file -e "${last_success}^{commit}" 2>/dev/null; then
            base="${last_success}"
            base_source="last_successful_workflow_run"
          else
            before="${{ github.event.before }}"
            if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="${before}"
              base_source="event_before"
            fi
          fi

          if [[ -z "${base}" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${base}" "${head}")"
          echo "base_source=${base_source}"
          echo "base=${base}"
          echo "head=${head}"
          echo "changed files:"
          echo "${changed}"
          if echo "${changed}" | grep -Eq '^(crates/admin/|crates/admin_core/|crates/core/|crates/infra/|crates/runtime/|deploy/docker/Dockerfile|Cargo\.toml|Cargo\.lock)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.changes.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/inkstone-admin
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: INKSTONE_PACKAGE=admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
