services:
  inkstone-public:
    image: ghcr.io/wincerchan/inkstone-public:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data:ro
  inkstone-admin:
    image: ghcr.io/wincerchan/inkstone-admin:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data
